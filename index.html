<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Roblox</title>
    <style>
        /* Configuration de la page */
        body {
            font-family: 'HCo Gotham SSm', "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Utilisation de ton image de fond */
            background: url('fondroblox.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* Overlay sombre pour mieux voir le formulaire si l'image est claire */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        /* Boîte de connexion */
        .login-container {
            position: relative;
            z-index: 1;
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 380px;
            text-align: center;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #404040;
        }

        /* Champs de saisie */
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #B8B8B8;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #F2F2F2;
            font-size: 15px;
        }

        input:focus {
            border-color: #0074E4;
            background-color: #fff;
            outline: none;
        }

        /* Bouton de connexion */
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #0074E4;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            font-size: 17px;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background-color: #0056A3;
        }

        /* Liens et texte */
        .footer-links {
            margin-top: 20px;
            font-size: 13px;
        }

        .footer-links a {
            text-decoration: none;
            color: #0074E4;
        }

        .signup-text {
            margin-top: 20px;
            border-top: 1px solid #E3E3E3;
            padding-top: 15px;
            font-size: 14px;
            color: #666;
        }

        #error-msg {
            color: #d32f2f;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Connexion à Roblox</h2>
    
    <form id="robloxLoginForm">
        <input type="text" id="user" placeholder="Utilisateur / E-mail" required>
        <input type="password" id="pass" placeholder="Mot de passe" required>
        
        <div id="error-msg">Nom d'utilisateur ou mot de passe incorrect.</div>
        
        <button type="submit" class="btn-login">Connexion</button>
    </form>

    <div class="footer-links">
        <a href="#">Mot de passe ou nom d'utilisateur oublié ?</a>
    </div>

    <div class="signup-text">
        Pas encore de compte ? <a href="#" style="color: #0074E4; font-weight: bold;">S'inscrire</a>
    </div>
</div>

<script>
    // Interaction simple pour simuler une tentative
    document.getElementById('robloxLoginForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Empêche le rechargement de la page
        
        const error = document.getElementById('error-msg');
        error.style.display = 'block'; // Affiche le message d'erreur
        
        console.log("Tentative de connexion :", document.getElementById('user').value);
    });
</script>

</body>
</html>
